# Supabase project configuration (local development and `supabase config push`).
project_id = "snapay"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = false

[auth]
enabled = true
# The app handles auth links through its custom URL scheme.
site_url = "snapay://auth-callback"
additional_redirect_urls = ["snapay://auth-callback", "snapay://reset-password"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8
password_requirements = "letters_digits"

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m0s"

[auth.email.template.confirmation]
subject = "אישור ההרשמה ל-SnaPay"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "איפוס הסיסמה ב-SnaPay"
content_path = "./supabase/templates/recovery.html"

[edge_runtime]
enabled = true

[functions.delete-account]
verify_jwt = true

[functions.exchange-rates]
verify_jwt = true

[functions.notify-partners]
verify_jwt = true

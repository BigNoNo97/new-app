name: SnaPay

options:
  bundleIdPrefix: com.bignono97
  developmentLanguage: he
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    # The first TestFlight build went up as 1.0 (XcodeGen's default), so versions continue from there.
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    # Colors come from Theme (Color("name")); generated symbols like Color.fill would clash with SwiftUI.
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
    ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO

packages:
  SnaPayCore:
    path: Packages/SnaPayCore
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "12.0.0"

targets:
  SnaPay:
    type: application
    platform: iOS
    sources:
      - SnaPay
      # The quick-log Live Activity's data and button intents, shared with the widget.
      - Shared
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    dependencies:
      - package: SnaPayCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - target: SnaPayWidget
    entitlements:
      path: SnaPay/SnaPay.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.bignono97.snapay
        # Partner notifications: the APNs sandbox in Debug, production in Release (TestFlight).
        aps-environment: $(APS_ENVIRONMENT)
    info:
      path: SnaPay/Info.plist
      properties:
        CFBundleDisplayName: SnaPay
        # XcodeGen writes a fixed "1.0 (1)" otherwise; the TestFlight workflow sets the build number.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: he
        CFBundleLocalizations: [he]
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSFaceIDUsageDescription: "SnaPay משתמשת ב-Face ID כדי לשמור על המידע הפיננסי שלך."
        NSCameraUsageDescription: "SnaPay משתמשת במצלמה כדי לצלם קבלות ולמלא את פרטי ההוצאה אוטומטית."
        NSPhotoLibraryUsageDescription: "SnaPay ניגשת לתמונות כדי לצרף קבלה להוצאה."
        UIBackgroundModes: [remote-notification]
        # The quick-log card that expands out of the Dynamic Island.
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: com.bignono97.snapay
            CFBundleURLSchemes: [snapay]
        FIREBASE_API_KEY: $(FIREBASE_API_KEY)
        FIREBASE_PROJECT_ID: $(FIREBASE_PROJECT_ID)
        FIREBASE_APP_ID: $(FIREBASE_APP_ID)
        FIREBASE_SENDER_ID: $(FIREBASE_SENDER_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bignono97.snapay
        # iPhone only. Set per target: XcodeGen's iOS preset sets "1,2" on every target, which
        # overrides project settings, and an iPad build must support every orientation.
        TARGETED_DEVICE_FAMILY: "1"
        # Firebase's Objective-C categories, linked through Swift Package Manager.
        OTHER_LDFLAGS: $(inherited) -ObjC
        # Empty except in the TestFlight workflow, which signs manually.
        PROVISIONING_PROFILE_SPECIFIER: $(SNAPAY_APP_PROFILE)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production

  SnaPayWidget:
    type: app-extension
    platform: iOS
    sources:
      - SnaPayWidget
      - Shared
    dependencies:
      - package: SnaPayCore
    entitlements:
      path: SnaPayWidget/SnaPayWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.bignono97.snapay
    info:
      path: SnaPayWidget/Info.plist
      properties:
        CFBundleDisplayName: SnaPay
        # Must match the app's version and build number.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: he
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bignono97.snapay.widget
        TARGETED_DEVICE_FAMILY: "1"
        # Shared/ compiles the Live Activity intents' work into the app only.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) SNAPAY_WIDGET
        PROVISIONING_PROFILE_SPECIFIER: $(SNAPAY_WIDGET_PROFILE)
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

  SnaPayUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - SnaPayUITests
    dependencies:
      - target: SnaPay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bignono97.snapay.uitests
        TARGETED_DEVICE_FAMILY: "1"
        TEST_TARGET_NAME: SnaPay
        # XCTestCase's initializers are nonisolated; test methods opt into @MainActor instead.
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

schemes:
  SnaPay:
    build:
      targets:
        SnaPay: all
        SnaPayUITests: [test]
    test:
      config: Debug
      targets:
        - SnaPayUITests
    run:
      config: Debug
    archive:
      config: Release

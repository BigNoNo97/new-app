name: TestFlight

# Builds, signs and uploads every merge to main to TestFlight.
# Stays off until the repository variable TESTFLIGHT_ENABLED is "true" and these secrets exist.
# Repository variables FIREBASE_API_KEY, FIREBASE_PROJECT_ID, FIREBASE_APP_ID and
# FIREBASE_SENDER_ID (from the Firebase console's GoogleService-Info.plist) point the build at the server.
#
# Signing is manual (the team has no App Store Connect API access):
#   signing/*.mobileprovision – App Store profiles for com.bignono97.snapay and its widget
#   APPLE_TEAM_ID       – the 10-character Team ID from developer.apple.com/account
#   DIST_CERT_P12       – the Apple Distribution certificate with its private key, as base64 .p12
#   DIST_CERT_PASSWORD  – the .p12 password
#   APPLE_ID            – the Apple ID that uploads the build
#   APPLE_APP_PASSWORD  – an app-specific password for that Apple ID (account.apple.com)

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "firebase/**"]
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    if: ${{ vars.TESTFLIGHT_ENABLED == 'true' }}
    runs-on: macos-26
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Select latest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install the distribution certificate
        env:
          DIST_CERT_P12: ${{ secrets.DIST_CERT_P12 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          # A secret saved from a file can end with a newline that isn't part of the password.
          DIST_CERT_PASSWORD="$(printf '%s' "$DIST_CERT_PASSWORD" | tr -d '\r\n')"
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$DIST_CERT_P12" | tr -d '\r\n ' | base64 --decode > "$RUNNER_TEMP/dist.p12"
          # OpenSSL 3 encrypts .p12 files with AES by default, which `security import` can't read
          # (it reports a wrong password). Re-encode with the legacy ciphers macOS understands.
          OPENSSL="$(brew --prefix openssl@3)/bin/openssl"
          if ! "$OPENSSL" pkcs12 -in "$RUNNER_TEMP/dist.p12" -passin env:DIST_CERT_PASSWORD -noout; then
            rm -f "$RUNNER_TEMP/dist.p12"
            echo "::error::DIST_CERT_PASSWORD doesn't open DIST_CERT_P12 (or DIST_CERT_P12 isn't a base64 .p12)"
            exit 1
          fi
          (
            umask 077
            "$OPENSSL" pkcs12 -in "$RUNNER_TEMP/dist.p12" -passin env:DIST_CERT_PASSWORD -nodes -out "$RUNNER_TEMP/dist.pem" &&
            "$OPENSSL" pkcs12 -export -in "$RUNNER_TEMP/dist.pem" -out "$RUNNER_TEMP/legacy.p12" -passout env:DIST_CERT_PASSWORD \
              -certpbe PBE-SHA1-3DES -keypbe PBE-SHA1-3DES -macalg sha1
          ) || { rm -f "$RUNNER_TEMP/dist.pem" "$RUNNER_TEMP/dist.p12"; exit 1; }
          rm -f "$RUNNER_TEMP/dist.pem" "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/legacy.p12" -k "$KEYCHAIN" -P "$DIST_CERT_PASSWORD" -f pkcs12 -A -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/legacy.p12"
          # The intermediate that issues Apple Distribution certificates.
          curl -fsSL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o "$RUNNER_TEMP/wwdr.cer"
          security import "$RUNNER_TEMP/wwdr.cer" -k "$KEYCHAIN" || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Install the provisioning profiles
        run: |
          shopt -s nullglob
          for dir in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" "$HOME/Library/MobileDevice/Provisioning Profiles"; do
            mkdir -p "$dir"
          done
          for profile in signing/*.mobileprovision; do
            security cms -D -i "$profile" > "$RUNNER_TEMP/profile.plist"
            uuid=$(plutil -extract UUID raw "$RUNNER_TEMP/profile.plist")
            name=$(plutil -extract Name raw "$RUNNER_TEMP/profile.plist")
            app_id=$(plutil -extract Entitlements.application-identifier raw "$RUNNER_TEMP/profile.plist")
            cp "$profile" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$uuid.mobileprovision"
            cp "$profile" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
            echo "$name → $app_id"
            case "$app_id" in
              *.com.bignono97.snapay) echo "SNAPAY_APP_PROFILE=$name" >> "$GITHUB_ENV" ;;
              *.com.bignono97.snapay.widget) echo "SNAPAY_WIDGET_PROFILE=$name" >> "$GITHUB_ENV" ;;
            esac
          done

      - name: Write Firebase settings
        env:
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          FIREBASE_SENDER_ID: ${{ vars.FIREBASE_SENDER_ID }}
        run: |
          {
            echo "FIREBASE_API_KEY = $FIREBASE_API_KEY"
            echo "FIREBASE_PROJECT_ID = $FIREBASE_PROJECT_ID"
            echo "FIREBASE_APP_ID = $FIREBASE_APP_ID"
            echo "FIREBASE_SENDER_ID = $FIREBASE_SENDER_ID"
          } > Config/Secrets.xcconfig

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Archive
        run: |
          if [ -z "$SNAPAY_APP_PROFILE" ] || [ -z "$SNAPAY_WIDGET_PROFILE" ]; then
            echo "::error::Missing App Store profiles in signing/ for com.bignono97.snapay and com.bignono97.snapay.widget"
            exit 1
          fi
          # Profiles are set per target in project.yml through these variables, so the Swift
          # packages aren't asked for one.
          xcodebuild archive \
            -project SnaPay.xcodeproj \
            -scheme SnaPay \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SnaPay.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            SNAPAY_APP_PROFILE="$SNAPAY_APP_PROFILE" \
            SNAPAY_WIDGET_PROFILE="$SNAPAY_WIDGET_PROFILE" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            -quiet

      - name: Export
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.bignono97.snapay</key><string>${SNAPAY_APP_PROFILE}</string>
              <key>com.bignono97.snapay.widget</key><string>${SNAPAY_WIDGET_PROFILE}</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/SnaPay.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          ls "$RUNNER_TEMP/export"

      - name: Upload to TestFlight
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun altool --upload-app -t ios \
            -f "$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)" \
            -u "$APPLE_ID" -p "$APPLE_APP_PASSWORD"

      - name: Remove the keychain
        if: always()
        run: '[ -z "$KEYCHAIN" ] || security delete-keychain "$KEYCHAIN" || true'

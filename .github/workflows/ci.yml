name: CI

on:
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Select latest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Test SnaPayCore
        run: swift test --package-path Packages/SnaPayCore

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build and run UI tests on a simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((r for r in devices if "iOS-26" in r), reverse=True)
          print(next(d["udid"] for r in runtimes for d in devices[r] if d["name"].startswith("iPhone")))
          ')
          echo "Simulator: $UDID"
          xcodebuild test \
            -project SnaPay.xcodeproj \
            -scheme SnaPay \
            -destination "id=$UDID" \
            -resultBundlePath build/UITests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      - name: Export screenshots
        if: always()
        run: |
          if [ -d build/UITests.xcresult ]; then
            mkdir -p build/screenshots
            xcrun xcresulttool export attachments --path build/UITests.xcresult --output-path build/screenshots || true
            ls build/screenshots | head -50
          fi

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: build/screenshots
          if-no-files-found: ignore
          retention-days: 14
